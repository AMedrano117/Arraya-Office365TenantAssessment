[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "m365-assessment"
version = "0.1.0"
description = "Microsoft 365 tenant assessment toolkit"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "rich>=13.0",
]

[project.scripts]
m365assess = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src/python*"]

[tool.setuptools.package-dir]
"" = "."
